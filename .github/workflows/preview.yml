name: Deploy isolated workout interactions preview
on:
  push:
    branches: [feature/workout-interactions-ux-refinement]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/workout-interactions/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feature/workout-interactions-ux-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build unchanged stable app
        working-directory: stable
        run: npm run build
      - name: Validate upgrade and backend boundaries
        working-directory: candidate
        run: |
          npm test
          npm run test:backend
          npm run validate:catalog
          npm run build:preview
      - name: Compose site and verify stable files did not change
        run: node candidate/scripts/compose-preview.mjs stable/dist candidate/dist site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Summarize the branch preview and environment requirement
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const stable=JSON.parse(readFileSync('site/version.json','utf8'));
          const preview=JSON.parse(readFileSync('site/preview/version.json','utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '## Workout interactions branch preview',
            `Branch: ${process.env.GITHUB_REF_NAME}; commit: ${process.env.GITHUB_SHA}`,
            `Production root: ${stable.version} (${stable.build}), byte-identical to main.`,
            `Isolated /preview/: ${preview.version} (${preview.build}).`,
            '',
            'Deployment uses the existing protected github-pages environment.',
            'If GitHub rejects the branch before the deploy job starts, a repository owner must allow feature/workout-interactions-ux-refinement in Settings → Environments → github-pages → Deployment branches and tags.',
            'Re-running an older workflow run reuses its original commit and branch; use this workout interactions run or dispatch this workflow on the workout interactions branch.',
            '',
          ].join('\n\n'));
          NODE
  deploy:
    if: github.ref == 'refs/heads/feature/workout-interactions-ux-refinement'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
