<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Bro — A fresh direction</title>
  <link rel="stylesheet" href="./studio.css"><script type="module" src="./studio.js"></script>
</head>
<body>
  <div class="studio">
    <header class="studio-head"><div><span class="studio-label">GYM BRO · DESIGN STUDY 02</span><h1>A fresh direction.</h1><p>Three original systems. Designed around the work.</p></div><a href="./compare.html">Compare the screens <span aria-hidden="true">↗</span></a></header>
    <div class="studio-controls">
      <label>Direction<select id="direction"><option value="F">01 — Contour</option><option value="G">02 — Prism</option><option value="H">03 — Fieldwork</option></select></label>
      <label>Screen<select id="screen"><option value="workout">Workout home</option><option value="active">Active workout</option><option value="gains">Gains dashboard</option><option value="library">Exercise library</option><option value="schedule">Schedule</option><option value="settings">Settings</option></select></label>
      <label>Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Format<select id="format"><option value="phone">Phone</option><option value="desktop">Desktop</option></select></label>
    </div>
    <p class="studio-summary" id="direction-note"></p>
    <div class="stage"><section id="prototype" data-direction="F" data-theme="light" data-format="phone" aria-label="Gym Bro design prototype"></section></div>
    <footer class="studio-foot">Design prototypes · Same fictional journal · Sample logging stays in memory · No real workout data is accessed · No design selected</footer>
  </div>
</body>
</html>
