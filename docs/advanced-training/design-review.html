<div id="gymbro-design-review">
<style>
#gymbro-design-review {font-family:Arial,sans-serif;color-scheme:light dark}
#gymbro-design-review *{box-sizing:border-box}
#gymbro-design-review .gb-stage{min-height:870px;display:flex;justify-content:center;padding:16px 0 30px}
#gymbro-design-review .gb-phone{--paper:light-dark(#f5f6f1,#101c17);--surface:light-dark(#fff,#192820);--ink:light-dark(#203a2d,#e5eddf);--quiet:light-dark(#586b50,#afbea7);--line:light-dark(#d7ddcf,#40503d);--accent:light-dark(#294832,#d7ef9d);--on:light-dark(#edf6dc,#203222);--soft:light-dark(#e9efde,#283b29);width:390px;max-width:100%;min-height:820px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 16px 40px #0002;padding-bottom:22px}
#gymbro-design-review .gb-phone[data-theme=light]{color-scheme:light}#gymbro-design-review .gb-phone[data-theme=dark]{color-scheme:dark}
#gymbro-design-review header{padding:24px 22px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:10px}
#gymbro-design-review .gb-brand{font-size:22px;font-weight:700;letter-spacing:-1px}#gymbro-design-review .gb-brand span{font-weight:400;color:var(--quiet)}
#gymbro-design-review button,#gymbro-design-review select,#gymbro-design-review input,#gymbro-design-review textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px 12px;max-width:100%}
#gymbro-design-review button{cursor:pointer}#gymbro-design-review button:focus-visible,#gymbro-design-review select:focus-visible,#gymbro-design-review input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#gymbro-design-review .gb-tools{padding:14px 22px;display:grid;grid-template-columns:1fr 95px;gap:8px}#gymbro-design-review .gb-tools select{min-width:0;font-size:12px}
#gymbro-design-review main{padding:12px 22px}#gymbro-design-review h2{font-size:30px;line-height:1.12;letter-spacing:-1.2px;margin:12px 0 18px}#gymbro-design-review h3{font-size:20px;letter-spacing:-.5px;margin:8px 0 12px}#gymbro-design-review p{font-size:14px;line-height:1.6;margin:8px 0;color:var(--quiet)}#gymbro-design-review .gb-kicker{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--quiet);margin:8px 0}
#gymbro-design-review .gb-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}#gymbro-design-review .gb-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}#gymbro-design-review .gb-row label{flex:1;min-width:65px;font-size:12px;color:var(--quiet)}#gymbro-design-review input{width:100%;display:block;margin-top:8px;font-size:24px;font-weight:600;min-height:62px;text-align:center}
#gymbro-design-review .gb-primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}#gymbro-design-review .gb-full{width:100%;margin-top:12px}#gymbro-design-review .gb-muted{font-size:12px;color:var(--quiet)}#gymbro-design-review .gb-pill{font-size:12px;background:var(--soft);border-radius:20px;padding:8px 12px;display:inline-block}#gymbro-design-review .gb-meter{height:5px;background:var(--soft);margin:18px 0;border-radius:8px;overflow:hidden}#gymbro-design-review .gb-meter>i{display:block;height:100%;width:42%;background:var(--accent)}#gymbro-design-review .gb-note{padding:12px 14px;background:var(--soft);border-radius:10px;margin:14px 0;font-size:13px;line-height:1.5}#gymbro-design-review .gb-list{list-style:none;padding:0;margin:15px 0}#gymbro-design-review .gb-list li{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}#gymbro-design-review .gb-list small{display:block;color:var(--quiet);font-size:12px;margin-top:4px}#gymbro-design-review .gb-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#gymbro-design-review .gb-chips button{font-size:12px}#gymbro-design-review .gb-timer{background:var(--soft);padding:14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:8px}#gymbro-design-review .gb-timer strong{font-size:24px;font-variant-numeric:tabular-nums}#gymbro-design-review .gb-sample{font-size:11px;text-align:center;padding:12px;color:var(--quiet);border-top:1px solid var(--line)}#gymbro-design-review .gb-step{border-left:2px solid var(--line);padding:2px 0 2px 18px;margin:18px 0}#gymbro-design-review .gb-step.is-active{border-color:var(--accent)}#gymbro-design-review .gb-large{font-size:46px;letter-spacing:-2px;margin:15px 0}#gymbro-design-review .gb-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}#gymbro-design-review .gb-split>div{padding:12px 0}#gymbro-design-review .gb-split strong{display:block;font-size:26px;margin:8px 0}#gymbro-design-review .gb-sheet{margin:18px -22px -12px;padding:24px 22px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line)}#gymbro-design-review .gb-handle{width:34px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 20px}#gymbro-design-review [data-variant="Guided flow"] .gb-box{border-radius:8px}#gymbro-design-review .gb-feedback{min-height:24px;color:var(--ink);font-size:13px;margin-top:12px}
@media(max-width:360px){#gymbro-design-review header,#gymbro-design-review main{padding-left:16px;padding-right:16px}#gymbro-design-review .gb-tools{padding-left:16px;padding-right:16px}#gymbro-design-review .gb-sheet{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}#gymbro-design-review .gb-row{gap:7px}}
</style>
<div class="viz-carousel viz-dotted-background" aria-label="Gym Bro design concepts">
<section data-variant="Quiet focus" aria-label="Quiet focus concept"><div class="gb-stage"><article class="gb-phone" data-concept="A" aria-label="Quiet focus Gym Bro preview"><header><div class="gb-brand">gym <span>bro.</span></div><span class="gb-pill">A · Quiet focus</span></header><div class="gb-tools"><select aria-label="Feature preview"><option value="focus">Workout Focus</option><option value="backup">Backup & Data</option><option value="blocks">Training Blocks</option><option value="adaptive">Shorten Workout</option><option value="notes">Exercise Feedback</option><option value="calendar">Calendar Export</option></select><select aria-label="Preview appearance"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><main></main><footer class="gb-sample">DESIGN PROTOTYPE · Synthetic examples · No saved data</footer></article></div></section>
<section data-variant="Performance desk" aria-label="Performance desk concept" hidden><div class="gb-stage"><article class="gb-phone" data-concept="B" aria-label="Performance desk Gym Bro preview"><header><div class="gb-brand">gym <span>bro.</span></div><span class="gb-pill">B · Performance</span></header><div class="gb-tools"><select aria-label="Feature preview"><option value="focus">Workout Focus</option><option value="backup">Backup & Data</option><option value="blocks">Training Blocks</option><option value="adaptive">Shorten Workout</option><option value="notes">Exercise Feedback</option><option value="calendar">Calendar Export</option></select><select aria-label="Preview appearance"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><main></main><footer class="gb-sample">DESIGN PROTOTYPE · Synthetic examples · No saved data</footer></article></div></section>
<section data-variant="Guided flow" aria-label="Guided flow concept" hidden><div class="gb-stage"><article class="gb-phone" data-concept="C" aria-label="Guided flow Gym Bro preview"><header><div class="gb-brand">gym <span>bro.</span></div><span class="gb-pill">C · Guided flow</span></header><div class="gb-tools"><select aria-label="Feature preview"><option value="focus">Workout Focus</option><option value="backup">Backup & Data</option><option value="blocks">Training Blocks</option><option value="adaptive">Shorten Workout</option><option value="notes">Exercise Feedback</option><option value="calendar">Calendar Export</option></select><select aria-label="Preview appearance"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><main></main><footer class="gb-sample">DESIGN PROTOTYPE · Synthetic examples · No saved data</footer></article></div></section>
</div>
<script>
(()=>{
 const root=document.getElementById('gymbro-design-review');
 const button=(s,primary=false)=>`<button type="button" class="${primary?'gb-primary ':''}gb-full" data-demo>${s}</button>`;
 const list=items=>`<ul class="gb-list">${items.map(([s,d])=>`<li>${s}<small>${d}</small></li>`).join('')}</ul>`;
 const fields=`<div class="gb-row"><label>Weight · kg<input type="number" value="60" min="0" max="1000"></label><label>Reps<input type="number" value="10" min="1" max="200"></label><label>RIR<input type="number" value="2" min="0" max="10"></label></div>`;
 const timer=`<div class="gb-timer"><span class="gb-muted">Rest timer · optional</span><strong>1:30</strong><button type="button" data-timer>Start</button></div>`;
 const screens={
 focus:{title:'One set. All in.',kicker:'Full body A · Exercise 2 of 5',A:`<div class="gb-meter"><i></i></div><div class="gb-box"><span class="gb-pill">Set 2 of 3</span><h2>Bench press</h2><p>Last session · 60 kg × 10 · RIR 2</p>${fields}${button('Complete set',true)}</div><div class="gb-note">Previous note: Keep feet planted.</div>${timer}<div class="gb-row"><button data-demo>← Previous</button><button data-demo>Next exercise →</button></div>${button('View full workout / Exit focus')}`,B:`<h3>Bench press</h3><div class="gb-split"><div><span class="gb-muted">Last session</span><strong>60 × 10</strong><span class="gb-muted">kg · RIR 2</span></div><div><span class="gb-muted">Today</span><strong>1 / 3</strong><span class="gb-muted">sets completed</span></div></div><div class="gb-box"><div class="gb-row"><strong>Active set 2</strong><span class="gb-pill">Working</span></div>${fields}${button('Log set & continue',true)}</div>${list([['Superset A · Bench + Cable row','Bench: 1/3 sets · Row: 1/3 sets']])}<div class="gb-row"><button data-demo>Bench press</button><button data-demo>Cable row</button></div>${timer}${button('Notes · Workout overview · Exit')}`,C:`<p class="gb-kicker">Step 2 · Perform</p><h2>Bench press</h2><div class="gb-step"><span class="gb-muted">1 · Prepare</span><p>Last time: 60 kg × 10 · RIR 2</p></div><div class="gb-step is-active"><strong>2 · Log your set</strong>${fields}${button('Complete set 2',true)}</div><div class="gb-step"><span class="gb-muted">3 · Recover</span><p>Optional rest, then your next set.</p></div>${timer}${button('All exercises · Skip · Exit focus')}`},
 backup:{title:'Your progress, protected.',kicker:'Settings / Backup & Data',A:`<div class="gb-box"><span class="gb-pill">Saved on this device</span><h3>No verified backup yet</h3><p>Local storage is your journal. Keep a separate file to protect it.</p>${button('Export backup',true)}${button('Restore a backup')}</div><label class="gb-muted">Remind me<select class="gb-full"><option>Monthly</option><option>Weekly</option><option>Every three months</option><option>Never</option></select></label><div class="gb-note">Optional password protection. If you lose the password, the file cannot be recovered.</div>`,B:`${list([['Local journal','Saved on this device'],['File backup','No confirmed file save'],['Cloud backup','Not connected · no automatic sync']])}<div class="gb-box"><h3>Export options</h3><label><input type="checkbox" style="width:auto;display:inline;min-height:20px"> Include progress photos</label><p>Password protection: optional</p>${button('Review & export',true)}${button('Inspect restore file')}</div><p>Reminders · Monthly · Respects Gym Bro notifications</p>`,C:`<div class="gb-step is-active"><strong>1 · Protect your journal</strong><p>No verified file backup yet.</p>${button('Choose backup options',true)}</div><div class="gb-step"><strong>2 · Save the file</strong><p>Save to a trusted location. Download requested does not mean saved.</p></div><div class="gb-step"><strong>3 · Verify & recover</strong><p>Open a backup to preview contents before replacing data.</p>${button('Preview a backup')}</div><div class="gb-note">A recovery snapshot is kept before an approved restore.</div>`},
 blocks:{title:'Build your next chapter.',kicker:'Programs / Training Blocks',A:`<div class="gb-box"><span class="gb-pill">Week 3 of 6</span><h2>Build a stronger base</h2><p>Hypertrophy · Full body A / B / C</p><div class="gb-meter"><i></i></div><p>7 sessions completed · 3 weeks remaining after this week</p>${button('Review this week',true)}</div>${list([['Mon · Full body A','Existing recurring schedule'],['Wed · Full body B','Existing recurring schedule'],['Week 6 · Optional lighter week','Fewer sets · more reps in reserve']])}${button('Pause · Edit future weeks · More')}`,B:`<h3>Build a stronger base</h3><div class="gb-split"><div><span class="gb-muted">Current week</span><strong>3 / 6</strong></div><div><span class="gb-muted">Completed</span><strong>7 sessions</strong></div></div><div class="gb-chips"><button>W1</button><button>W2</button><button class="gb-primary">W3</button><button>W4</button><button>W5</button><button>W6 ↓</button></div>${list([['Working sets · 3','No automatic weekly volume increases'],['Rep target · 8–12','Progress load only when earned'],['Lighter week · optional','2 sets · RIR 4 · editable targets']])}${button('Edit future targets',true)}${button('Pause / Duplicate / End block')}`,C:`<div class="gb-step"><strong>1 · Foundation</strong><p>Weeks 1–2 · establish working loads</p></div><div class="gb-step is-active"><strong>2 · Build</strong><p>Week 3 of 6 · 7 sessions completed</p>${button('Open this week',true)}</div><div class="gb-step"><strong>3 · Continue or ease back</strong><p>Weeks 4–6 · review fatigue before an optional lighter week</p></div><div class="gb-box"><h3>Your schedule stays yours</h3><p>Uses existing recurring workouts. Completed records are preserved.</p>${button('Pause / Edit future weeks')}</div>`},
 adaptive:{title:'Make time for what matters.',kicker:'Workout / Time available',A:`<div class="gb-chips"><button>20 min</button><button class="gb-primary">25 min</button><button>30 min</button><button>Custom</button></div><div class="gb-box"><h3>48 → 25 min</h3><p>Estimated duration · includes remaining work</p>${list([['Keep · Squat + Bench + Row','Primary work and muscle coverage'],['Reduce · Lateral raise','3 → 1 working set'],['Defer · Cable curl','Lower priority for this session']])}${button('Use this version',true)}${button('Keep original workout')}</div><p>Completed sets, weights, RIR and notes stay intact. Your saved plan stays intact.</p>`,B:`<div class="gb-split"><div><span class="gb-muted">Original estimate</span><strong>48 min</strong></div><div><span class="gb-muted">Proposed estimate</span><strong>25 min</strong></div></div><label class="gb-muted">Minutes remaining<input type="number" value="25" min="5" max="180"></label>${list([['Squat · keep 3 sets','Priority movement'],['Bench + Row · keep 2 each','Preserve balanced coverage'],['Lateral raise · 3 → 1','Reduce accessory volume'],['Curl · defer remaining sets','No completed set removed']])}${button('Apply session variation',true)}${button('Adjust / Keep original')}`,C:`<p class="gb-kicker">Step 2 of 3 · Review</p><div class="gb-step"><strong>1 · Available time</strong><p>25 minutes remaining</p></div><div class="gb-step is-active"><strong>2 · Keep the essentials</strong>${list([['Keep · Squat, Bench, Row','Retain important work'],['Reduce · Raise · Defer · Curl','Session-only changes']])}<p>Estimated: 48 → 25 minutes</p></div><div class="gb-step"><strong>3 · Confirm your session</strong>${button('Accept shortened workout',true)}${button('Go back')}</div><div class="gb-note">You can return to the original plan while preserving completed work.</div>`},
 notes:{title:'Remember what works.',kicker:'Bench press / Exercise feedback',A:`<div class="gb-note">Previous note · Keep feet planted.<br><span class="gb-muted">Last session · Edit / Dismiss</span></div><div class="gb-sheet"><div class="gb-handle"></div><h3>How did it feel?</h3><div class="gb-chips"><button data-demo>Felt good</button><button data-demo>Difficult</button><button data-demo>Equipment</button><button data-demo>Technique</button><button data-demo>Discomfort</button></div><label class="gb-muted">Personal note<textarea class="gb-full" rows="3" placeholder="Grip, setup, or a reminder…"></textarea></label>${button('Save feedback',true)}<p>Private · stored on this device · included in backups</p></div>`,B:`<div class="gb-row"><span class="gb-pill">Latest note</span><button data-demo>Edit / Delete</button></div><h3>Keep feet planted.</h3><p>Bench press · Last session</p><div class="gb-box"><h3>Quick feedback</h3><div class="gb-chips"><button data-demo>Good</button><button data-demo>Hard</button><button data-demo>Equipment</button><button data-demo>Technique</button><button data-demo>Discomfort</button></div><textarea rows="2" class="gb-full" aria-label="Exercise note" placeholder="Add a short note"></textarea>${button('Save feedback',true)}</div>${list([['Earlier notes','Open exercise history'],['Review alternatives','Suggestions only · never auto-replaced']])}`,C:`<div class="gb-step is-active"><strong>1 · What stood out?</strong><div class="gb-chips"><button data-demo>Felt good</button><button data-demo>Harder</button><button data-demo>Equipment</button><button data-demo>Discomfort</button></div></div><div class="gb-step"><strong>2 · Leave a reminder</strong><textarea rows="3" class="gb-full" aria-label="Reminder note" placeholder="What would help next time?"></textarea></div>${button('Save & return to set',true)}<div class="gb-note">If a movement hurts, stop or skip it. Review an alternative; seek qualified advice for persistent or significant symptoms.</div>${button('Review / Edit / Delete past notes')}`},
 calendar:{title:'Make training a date.',kicker:'Calendar / Export',A:`<div class="gb-box"><span class="gb-pill">Weekly schedule</span><h3>Full body A</h3><p>Monday · Wednesday · Friday<br>18:00 · Device local time</p><label class="gb-muted">Calendar reminder<select class="gb-full"><option>30 minutes before</option><option>None</option></select></label>${button('Export calendar file',true)}</div><p>Apple: open or share the file to Calendar.<br>Google: use Calendar’s import settings on desktop.</p><div class="gb-note">This is an export, not continuous sync. Reimporting may create duplicates. Calendar alerts use your calendar app’s settings.</div>`,B:`${list([['Export scope','Full body A · recurring series'],['Weekly rule','Monday / Wednesday / Friday · 18:00'],['Ends','December 20 · editable'],['Time zone','Device local time · daylight saving aware'],['Reminder','30 minutes before']])}${button('Download .ics',true)}${button('Share file when supported')}<div class="gb-note">Stable event IDs are included. Your calendar may still duplicate reimported files. Gym Bro notification settings do not control imported calendar alerts.</div>`,C:`<div class="gb-step"><strong>1 · Choose workouts</strong><p>Full body A · M / W / F · 18:00</p></div><div class="gb-step is-active"><strong>2 · Review reminders</strong><select class="gb-full" aria-label="Calendar reminder"><option>30 minutes before</option><option>None</option></select><p>External calendar settings control alert delivery.</p></div><div class="gb-step"><strong>3 · Add to your calendar</strong>${button('Export .ics file',true)}<p>Apple: open file in Calendar.<br>Google: import on desktop.</p></div><p>One-way export · reimporting may create duplicates.</p>`}
 };
 function render(phone){const feature=phone.querySelector('select').value,s=screens[feature];phone.querySelector('main').innerHTML=`<p class="gb-kicker">${s.kicker}</p><h2>${s.title}</h2>${s[phone.dataset.concept]}<div class="gb-feedback" role="status" aria-live="polite"></div>`;}
 root.querySelectorAll('.gb-phone').forEach(phone=>{const selects=phone.querySelectorAll('select');selects[0].addEventListener('change',()=>render(phone));selects[1].addEventListener('change',()=>phone.dataset.theme=selects[1].value);render(phone);phone.addEventListener('click',e=>{if(e.target.closest('[data-demo]'))phone.querySelector('.gb-feedback').textContent='Prototype only — no journal data changed.';if(e.target.closest('[data-timer]')){const b=e.target.closest('[data-timer]');b.textContent=b.textContent==='Start'?'Stop':'Start';phone.querySelector('.gb-feedback').textContent='Timer interaction preview only.';}});});
 if(globalThis.Tweak){const state={appearance:'auto'};new Tweak({container:root,onChange:()=>root.querySelectorAll('.gb-phone').forEach(p=>p.dataset.theme=state.appearance)}).addSelect(state,'appearance',{label:'Appearance',options:['auto','light','dark']});}
})();
</script>
</div>
